# Publishes site/ to GitHub Pages. Only by hand: Actions → "Publish site" → Run workflow,
# or `gh workflow run pages.yml`. Nothing is built here: scripts/site.sh draws the pictures
# locally (it needs Herdr App's icons), and they are committed with the page.
name: Publish site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # Since v4 it leaves out dotfiles; site/ has none.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
