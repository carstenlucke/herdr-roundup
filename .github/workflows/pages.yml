# Publishes site/ to GitHub Pages. Only by hand: Actions → "Publish site" → Run workflow,
# or `gh workflow run pages.yml`. Nothing is built here: scripts/site.sh draws the pictures
# locally (it needs Herdr App's icons), and they are committed with the page.
name: Publish site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Upload and deploy in two jobs, as in GitHub's own Pages workflow: deploy-pages lists the run's
# artifacts, and right after upload-pages-artifact in the same job that list can still be empty
# ("No artifacts named github-pages were found", three runs in a row on 2026-11-24). A second
# job starts only once the first has finished, with the artifact listed.
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # Since v4 it leaves out dotfiles; site/ has none.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
